# Monitor externo de Europa ITS (roadmap F6.2 del back office, migración 246).
# Corre en GitHub Actions cada 5 minutos, fuera de Supabase: si algo falla abre
# una issue en este repo y GitHub avisa por email a quien la tiene asignada.
owner: oscarsvq
repo: upptime

sites:
  - name: Back office (web)
    url: https://crm.europaits.com
  - name: Back office (autenticación)
    url: https://soxyceaoztvcefnsxxmb.supabase.co/auth/v1/health
    headers:
      - "apikey: $SUPABASE_ANON_KEY_BACKOFFICE"
  # 200 solo si la base de datos contesta, el sync nocturno terminó bien, la copia
  # de Storage tiene menos de 36 h y ningún job de pg_cron ha fallado.
  # El detalle por componente está en la respuesta JSON.
  - name: Back office (salud interna)
    url: https://soxyceaoztvcefnsxxmb.supabase.co/functions/v1/salud
    expectedStatusCodes:
      - 200

assignees:
  - oscarsvq

status-website:
  baseUrl: /upptime
  name: Estado de los servicios de Europa ITS
  introTitle: "Estado de los servicios de Europa ITS"
  introMessage: "Comprobación automática cada 5 minutos desde GitHub."
  navbar:
    - title: Estado
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO
